<app-header></app-header>

<main class="main-content">
  <mat-tab-group dynamicHeight animationDuration="250ms" class="workspace-tabs">
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="material-symbols-outlined tab-icon">dashboard</mat-icon>
        Valuation Workspace
      </ng-template>
      <app-metric-dashboard></app-metric-dashboard>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="material-symbols-outlined tab-icon">menu_book</mat-icon>
        Metrics Explorer
      </ng-template>
      <app-metric-explorer></app-metric-explorer>
    </mat-tab>
  </mat-tab-group>
</main>
