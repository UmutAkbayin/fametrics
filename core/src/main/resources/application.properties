spring.application.name=fa-metrics

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

screener.base-url=http://localhost:8081

# SEC requires a contact email in the User-Agent header on every request;
# same env var name the screener (Go service) uses for the same requirement.
sec.user-agent-email=${SEC_USER_AGENT_EMAIL}

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/fa-metrics
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true