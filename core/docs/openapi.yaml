openapi: 3.0.3
info:
  title: fa-metrics API
  description: >
    REST API for computing common stock valuation metrics from raw financial
    inputs. All calculations use arbitrary-precision decimal arithmetic and
    return results scaled to 2 decimal places (HALF_UP rounding). No data is 
    persisted — every endpoint is a pure calculation over the request body.

    Every endpoint accepts the same request shape (`SummaryRequest`), a
    superset of inputs covering all metrics. Nothing is required at the
    schema level: each metric simply reads the sub-object(s) it needs, and
    if those inputs are missing or fail a metric-specific business rule
    (e.g. a value that must be positive), the metric is treated as
    uncomputable rather than the request being rejected.
  version: "0.0.1"
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Valuation
    description: Individual and aggregate valuation metric calculations
  - name: Candidates
    description: >
      Orchestration layer: pulls fundamentals-only candidates from the
      screener service, prices them from core's own FMP-backed price cache
      (resolved via a SEC CIK-to-ticker lookup, both refreshed on a
      schedule, not live per request), runs them through the Valuation
      metrics above in-process, and returns a combined ranking. Unlike the
      Valuation endpoints, this calls the screener live and can return 503
      if it's unavailable.

paths:
  /api/metrics/pe-ttm:
    post:
      tags: [Valuation]
      summary: Price-to-Earnings (TTM) ratio — value only
      description: >
        sharePrice / eps. Reads `marketData.sharePrice` and `marketData.eps`
        (both must be strictly positive).
      operationId: getPeTtm
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/pe-ttm/assessment:
    post:
      tags: [Valuation]
      summary: Price-to-Earnings (TTM) ratio — full assessment
      description: Same inputs as `/pe-ttm`, plus a benchmark-based assessment and interpretation.
      operationId: getPeTtmAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/pb:
    post:
      tags: [Valuation]
      summary: Price-to-Book ratio — value only
      description: >
        sharePrice / bvps. Reads `marketData.sharePrice` and `marketData.bvps`
        (both must be strictly positive).
      operationId: getPbRatio
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/pb/assessment:
    post:
      tags: [Valuation]
      summary: Price-to-Book ratio — full assessment
      description: Same inputs as `/pb`, plus a benchmark-based assessment and interpretation.
      operationId: getPbRatioAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/ps:
    post:
      tags: [Valuation]
      summary: Price-to-Sales ratio — value only
      description: >
        marketCap / totalRevenue. Reads `fundamentalData.marketCap` and
        `fundamentalData.totalRevenue` (both must be strictly positive).
      operationId: getPsRatio
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/ps/assessment:
    post:
      tags: [Valuation]
      summary: Price-to-Sales ratio — full assessment
      description: Same inputs as `/ps`, plus a benchmark-based assessment and interpretation.
      operationId: getPsRatioAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/peg:
    post:
      tags: [Valuation]
      summary: Price/Earnings-to-Growth ratio — value only
      description: >
        (sharePrice / eps) / (epsGrowthRate * 100). Reads
        `marketData.sharePrice`, `marketData.eps` (both must be strictly
        positive) and `fundamentalData.epsGrowthRate` (must be strictly
        positive).
      operationId: getPegRatio
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/peg/assessment:
    post:
      tags: [Valuation]
      summary: Price/Earnings-to-Growth ratio — full assessment
      description: Same inputs as `/peg`, plus a benchmark-based assessment and interpretation.
      operationId: getPegRatioAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/de:
    post:
      tags: [Valuation]
      summary: Debt-to-Equity ratio — value only
      description: >
        totalLiabilities / totalEquity. Reads
        `capitalStructure.totalLiabilities` (must be zero or positive) and
        `capitalStructure.totalEquity` (must be strictly positive).
      operationId: getDeRatio
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/de/assessment:
    post:
      tags: [Valuation]
      summary: Debt-to-Equity ratio — full assessment
      description: Same inputs as `/de`, plus a benchmark-based assessment and interpretation.
      operationId: getDeRatioAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/roe:
    post:
      tags: [Valuation]
      summary: Return on Equity — value only
      description: >
        netIncome / totalEquity. Reads `capitalStructure.netIncome` (may be
        negative, i.e. a loss) and `capitalStructure.totalEquity` (must be
        strictly positive).
      operationId: getRoe
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/roe/assessment:
    post:
      tags: [Valuation]
      summary: Return on Equity — full assessment
      description: Same inputs as `/roe`, plus a benchmark-based assessment and interpretation.
      operationId: getRoeAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/graham:
    post:
      tags: [Valuation]
      summary: Graham Number — value only
      description: >
        sqrt(22.5 * eps * bvps). Reads `marketData.eps` and `marketData.bvps`
        (both must be strictly positive). The assessment variant additionally
        compares `marketData.sharePrice` against the computed Graham Number.
      operationId: getGrahamNumber
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/graham/assessment:
    post:
      tags: [Valuation]
      summary: Graham Number — full assessment
      description: >
        Same inputs as `/graham`, plus a benchmark-based assessment and
        interpretation. The benchmark's `upperBound` is the Graham Number
        itself; `lowerBound` is not meaningful for this metric.
      operationId: getGrahamNumberAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/lynch:
    post:
      tags: [Valuation]
      summary: Peter Lynch Fair Value — value only
      description: >
        eps * (epsGrowthRate * 100). Reads `marketData.eps` (must be
        strictly positive) and `fundamentalData.epsGrowthRate` (required,
        may be negative). The assessment variant additionally compares
        `marketData.sharePrice` against the computed fair value.
      operationId: getLynchFairValue
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecimalResultOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/lynch/assessment:
    post:
      tags: [Valuation]
      summary: Peter Lynch Fair Value — full assessment
      description: >
        Same inputs as `/lynch`, plus a benchmark-based assessment and
        interpretation. The benchmark's `upperBound` is the fair value
        itself; `lowerBound` is not meaningful for this metric.
      operationId: getLynchFairValueAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MetricResponseOk"
        "422":
          $ref: "#/components/responses/Uncomputable"

  /api/metrics/summary/assessment:
    post:
      tags: [Valuation]
      summary: Full assessment of every valuation metric
      description: >
        Runs every metric's full assessment against the shared set of
        inputs and returns them together. Unlike the single-metric
        endpoints, this never returns 422 — any metric that cannot be
        computed from the given inputs is simply omitted from the
        `metrics` array rather than failing the whole request.
      operationId: getSummaryAssessment
      requestBody:
        $ref: "#/components/requestBodies/SummaryRequest"
      responses:
        "200":
          description: Metrics that could be computed from the given inputs (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"

  /api/candidates/top:
    get:
      tags: [Candidates]
      summary: Top-ranked value-investing candidates
      description: >
        Combines the screener's fundamentals-only quality_score with core's
        own price-dependent Value Score (a 50/50-weighted composite;
        weighting is a tunable starting point, not a researched value),
        sorted descending. A candidate needs both scores to appear at all —
        one missing an entire factor (e.g. no price could be resolved for
        it) is left out rather than partially scored. Always computed
        fresh against the screener's current candidates and core's current
        price/ticker caches — no caching or change-detection on this
        endpoint itself.
      operationId: getTopCandidates
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
      responses:
        "200":
          description: Top candidates, sorted by finalScore descending (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopCandidateResponse"
        "503":
          description: >
            A required upstream service (currently: the screener) is
            unavailable. Distinct from 500 — this isn't a bug in core, an
            upstream dependency is temporarily down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  requestBodies:
    SummaryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SummaryRequest"

  responses:
    DecimalResultOk:
      description: Calculated metric value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DecimalResult"
    MetricResponseOk:
      description: Calculated value plus its benchmark-based assessment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MetricResponse"
    Uncomputable:
      description: >
        Request was well-formed but the metric could not be calculated
        (required inputs were missing, or failed a metric-specific
        business rule such as "must be positive"). No response body.

  schemas:
    DecimalResult:
      type: number
      format: decimal
      description: Result scaled to 2 decimal places (HALF_UP rounding).
      example: 12.34

    Metric:
      type: string
      enum:
        - PE_TTM
        - PB_RATIO
        - PS_RATIO
        - PEG_RATIO
        - DE_RATIO
        - ROE
        - GRAHAM_NUMBER
        - LYNCH_FAIR_VALUE

    Rating:
      type: string
      description: >
        FAVORABLE/NEUTRAL/UNFAVORABLE compare the value against the
        benchmark range. NOT_MEANINGFUL means the comparison inputs (e.g.
        share price) were absent, so only the raw value/benchmark are
        meaningful.
      enum:
        - FAVORABLE
        - NEUTRAL
        - UNFAVORABLE
        - NOT_MEANINGFUL

    MarketData:
      type: object
      properties:
        sharePrice:
          type: number
          format: decimal
          nullable: true
        eps:
          type: number
          format: decimal
          nullable: true
        bvps:
          type: number
          format: decimal
          nullable: true

    FundamentalData:
      type: object
      properties:
        marketCap:
          type: number
          format: decimal
          nullable: true
        totalRevenue:
          type: number
          format: decimal
          nullable: true
        epsGrowthRate:
          type: number
          format: decimal
          nullable: true
          description: Fractional growth rate (e.g. 0.15 for 15%). May be negative.

    CapitalStructure:
      type: object
      properties:
        totalLiabilities:
          type: number
          format: decimal
          nullable: true
        totalEquity:
          type: number
          format: decimal
          nullable: true
        netIncome:
          type: number
          format: decimal
          nullable: true
          description: May be negative (a loss).

    SummaryRequest:
      type: object
      description: >
        Superset of inputs for every metric. No field is required at the
        schema level — each metric simply reads the sub-object(s) it needs
        and is treated as uncomputable if they're missing or invalid.
      properties:
        marketData:
          $ref: "#/components/schemas/MarketData"
        fundamentalData:
          $ref: "#/components/schemas/FundamentalData"
        capitalStructure:
          $ref: "#/components/schemas/CapitalStructure"

    Assessment:
      type: object
      properties:
        rating:
          $ref: "#/components/schemas/Rating"
        label:
          type: string
          example: "Low P/E"

    Benchmark:
      type: object
      description: >
        The reference range the value was judged against. Either bound may
        be null for metrics where only one side is meaningful (e.g. Graham
        Number and Lynch Fair Value only set upperBound).
      properties:
        lowerBound:
          $ref: "#/components/schemas/DecimalResult"
        upperBound:
          $ref: "#/components/schemas/DecimalResult"
        explanation:
          type: string

    MetricResponse:
      type: object
      properties:
        metric:
          $ref: "#/components/schemas/Metric"
        value:
          $ref: "#/components/schemas/DecimalResult"
        assessment:
          $ref: "#/components/schemas/Assessment"
        benchmark:
          $ref: "#/components/schemas/Benchmark"
        description:
          type: string
          description: Static explanation of what the metric measures.
        interpretation:
          type: string
          description: Human-readable interpretation of this specific value/assessment.

    SummaryResponse:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricResponse"

    ValueScore:
      type: object
      description: >
        core's own price-dependent ranking, separate from the screener's
        fundamentals-only quality_score. Each *Percentile field is a 0-100
        percentile rank of that metric across the current candidate pool,
        not the raw metric value. ROE is deliberately not a component here
        even though it's one of the Valuation metrics — the screener's
        quality_score already ranks on it, and including it again here
        would double-weight it once quality_score and this composite are
        combined into finalScore.
      properties:
        peTtmPercentile:
          $ref: "#/components/schemas/DecimalResult"
        pbRatioPercentile:
          $ref: "#/components/schemas/DecimalResult"
        psRatioPercentile:
          $ref: "#/components/schemas/DecimalResult"
        pegRatioPercentile:
          $ref: "#/components/schemas/DecimalResult"
        discountToFairValuePercentile:
          $ref: "#/components/schemas/DecimalResult"
          description: >
            Percentile rank of 1 - price/fairValue, averaging the Graham
            Number and Lynch Fair Value estimates where both are available.
            Higher is more undervalued.
        composite:
          $ref: "#/components/schemas/DecimalResult"
          description: Average of whichever of the fields above are present for this candidate.

    TopCandidateResponse:
      type: object
      properties:
        cik:
          type: integer
          format: int64
        name:
          type: string
        ticker:
          type: string
        periodEnd:
          type: string
          format: date
          description: Fiscal year end date of the 10-K this candidate's fundamentals reflect.
        price:
          $ref: "#/components/schemas/DecimalResult"
          description: The cached FMP price this candidate was ranked against — not necessarily live.
        qualityScore:
          $ref: "#/components/schemas/DecimalResult"
          description: The screener's own fundamentals-only 0-100 percentile score.
        valueScore:
          $ref: "#/components/schemas/ValueScore"
        finalScore:
          $ref: "#/components/schemas/DecimalResult"
          description: 50/50-weighted combination of qualityScore and valueScore.composite — what the list is sorted by.
        metrics:
          type: array
          description: >
            Full per-metric detail (value, rating, interpretation) from the
            existing Valuation engine, run unmodified against this
            candidate's data — the same shape as /summary/assessment.
          items:
            $ref: "#/components/schemas/MetricResponse"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "A required upstream service is currently unavailable. Please try again shortly."
